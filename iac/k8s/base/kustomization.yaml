apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lorawan

resources:
- chirpstack-configmap.yaml
- chirpstack-deployment.yaml
- chirpstack-service.yaml
- chirpstack-ingress.yaml
- gateway-bridge-deployment.yaml
- gateway-bridge-service.yaml
- postgres-deployment.yaml
- postgres-service.yaml
- redis-deployment.yaml
