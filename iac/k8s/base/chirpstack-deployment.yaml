apiVersion: apps/v1
kind: Deployment
metadata:
  name: chirpstack
  namespace: lorawan
  labels:
    app: chirpstack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chirpstack
  template:
    metadata:
      labels:
        app: chirpstack
    spec:
      containers:
      - name: chirpstack
        image: chirpstack/chirpstack:4.11.0
        args:
        - -c
        - /etc/chirpstack
        env:
        - name: POSTGRESQL__DSN
          valueFrom:
            secretKeyRef:
              name: lorawan-secrets
              key: POSTGRES_DSN
        - name: API__SECRET
          valueFrom:
            secretKeyRef:
              name: lorawan-secrets
              key: CHIRPSTACK_SECRET_KEY
        - name: REGION_EU868__GATEWAY__BACKEND__TYPE
          value: "mqtt"
        - name: REGION_EU868__GATEWAY__BACKEND__MQTT__TOPIC_PREFIX
          value: "eu868"
        - name: REGION_EU868__GATEWAY__BACKEND__MQTT__SERVER
          value: "tcp://mosquitto.lorawan.svc.cluster.local:1883"
        ports:
        - containerPort: 8080
          name: api-http
        - containerPort: 8090
          name: api-grpc
        volumeMounts:
        - name: config
          mountPath: /etc/chirpstack
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
      volumes:
      - name: config
        configMap:
          name: chirpstack-config
