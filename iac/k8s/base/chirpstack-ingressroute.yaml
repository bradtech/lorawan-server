apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: chirpstack-web
  namespace: lorawan
spec:
  entryPoints:
  - web
  routes:
  - kind: Rule
    match: Host(`eu1.lorawan.brad.technology`) && PathPrefix(`/router-info`)
    services:
    - name: gateway-bridge
      port: 3001
  - kind: Rule
    match: Host(`eu1.lorawan.brad.technology`) && PathPrefix(`/router-ns`)
    services:
    - name: gateway-bridge
      port: 3001
  - kind: Rule
    match: Host(`eu1.lorawan.brad.technology`) && PathPrefix(`/gateway`)
    services:
    - name: gateway-bridge
      port: 3001
  - kind: Rule
    match: Host(`eu1.lorawan.brad.technology`) && Headers(`Upgrade`, `websocket`)
    services:
    - name: gateway-bridge
      port: 3001
  - kind: Rule
    match: Host(`eu1.lorawan.brad.technology`)
    services:
    - name: chirpstack
      port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: chirpstack-websecure
  namespace: lorawan
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`eu1.lorawan.brad.technology`) && PathPrefix(`/router-info`)
    services:
    - name: gateway-bridge
      port: 3001
  - kind: Rule
    match: Host(`eu1.lorawan.brad.technology`) && PathPrefix(`/router-ns`)
    services:
    - name: gateway-bridge
      port: 3001
  - kind: Rule
    match: Host(`eu1.lorawan.brad.technology`) && PathPrefix(`/gateway`)
    services:
    - name: gateway-bridge
      port: 3001
  - kind: Rule
    match: Host(`eu1.lorawan.brad.technology`) && Headers(`Upgrade`, `websocket`)
    services:
    - name: gateway-bridge
      port: 3001
  - kind: Rule
    match: Host(`eu1.lorawan.brad.technology`)
    services:
    - name: chirpstack
      port: 8080
  tls:
    certResolver: myresolver
