apiVersion: v1
kind: ConfigMap
metadata:
  name: chirpstack-config
  namespace: lorawan
data:
  chirpstack.toml: |
    [logging]
    level = "info"

    [postgresql]
    dsn = "postgresql://chirpstack:BradSecurePostgresPassword2026!@postgres.lorawan.svc.cluster.local:5432/chirpstack?sslmode=disable"
    max_open_connections = 10

    [redis]
    servers = [
      "redis://redis.lorawan.svc.cluster.local:6379/0"
    ]

    [network]
    enabled_regions = ["eu868"]

    [[regions]]
    id = "eu868"
    description = "EU868"

    [regions.gateway.backend.mqtt]
    server = "tcp://mosquitto.lorawan.svc.cluster.local:1883"
    topic_prefix = "eu868"

    extra_channels = [
      { frequency = 867100000, min_dr = 0, max_dr = 5 },
      { frequency = 867300000, min_dr = 0, max_dr = 5 },
      { frequency = 867500000, min_dr = 0, max_dr = 5 },
      { frequency = 867700000, min_dr = 0, max_dr = 5 },
      { frequency = 867900000, min_dr = 0, max_dr = 5 }
    ]

    [api]
    bind = "0.0.0.0:8080"
    secret = "0e7a4b893f12c98d65431201feba98765432109876543210123456789abcdef0"

    [integration]
    enabled = ["mqtt"]

    [integration.mqtt]
    server = "tcp://mosquitto.lorawan.svc.cluster.local:1883"
